name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    name: RDP
    runs-on: windows-latest
    timeout-minutes: 55

    defaults:
      run:
        shell: pwsh

    steps:

      - name: Configurar RDP
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service "TermService"

          Write-Host "RDP habilitado."

      - name: Instalar Tailscale
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installer -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $ts)) {
            throw "Tailscale não foi instalado."
          }

          Write-Host "Tailscale instalado."

      - name: Conectar Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "O secret TAILSCALE_AUTH_KEY não existe."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="github-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao conectar ao Tailscale."
          }

          Write-Host "Tailscale conectado."

      - name: Criar usuário RDP
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Web

          $chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%"

          $password = -join (
            1..16 | ForEach-Object {
              $chars[(Get-Random -Maximum $chars.Length)]
            }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name "RDPUser" `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser `
              -Name "RDPUser" `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name "RDPUser" `
              -Password $securePassword `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
           
